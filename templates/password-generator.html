<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Crackable? | Password Generator</title>
</head>
<body>
    <div id="maindiv">
        <h1>Crackable?</h1>
        <h3>Password Generator</h3>

        <form action="{{ url_for('password_gen') }}" method="post">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flashes">
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
            <h1>{{ password }}</h1>

            <input placeholder="Password Length" id="Length" type="number" name="length" class="css-input">
            <label for="lchars">Include Lowercase Characters</label>
            <input type="checkbox" id="lchars" name="lchars" class="css-input">
            <label for="uchars">Include Uppercase Characters</label>
            <input type="checkbox" id="uchars" name="uchars" class="css-input">
            <label for="nums">Include Numbers</label>
            <input type="checkbox" id="nums" name="nums" class="css-input">
            <label for="symbols">Include Symbols</label>
            <input type="checkbox" id="symbols" name="symbols" class="css-input">
            <button type="submit" class="btn">Generate</button>
        </form>
        <br>
        <a href="{{ url_for('crackable_main') }}" class="btn">Back</a>
    </div>
</body>
</html>
